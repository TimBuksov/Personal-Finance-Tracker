<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal Finance Tracker</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>Personal Finance Tracker</h1><p>Log income and expenses. Your data is stored locally in the API database.</p></header><section class="cards"><article><span>Income</span><strong id="income">$0.00</strong></article><article><span>Expenses</span><strong id="expenses">$0.00</strong></article><article><span>Balance</span><strong id="balance">$0.00</strong></article></section><section><h2>Add transaction</h2><form id="form"><input name="description" placeholder="Description" required maxlength="120"><input name="category" placeholder="Category" required maxlength="60"><input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required><input name="date" type="date" required><select name="kind"><option>EXPENSE</option><option>INCOME</option></select><button>Add</button></form><p id="message" role="status"></p></section><section><h2>Transactions</h2><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/app.js"></script></body></html>
